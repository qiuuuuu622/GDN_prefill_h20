service:
  host: 0.0.0.0
  port: 19000
  policy:
    interval: 10
    probe_timeout: 5
    failure_threshold: 3
    startup_timeout: 3600
    all_down_timeout: 120
    stop_timeout: 45
    restart_backoff: 5
worker:
  env:
    DYN_NAMESPACE: gdn35-e2e-1023
    ETCD_ENDPOINTS: http://127.0.0.1:12379
    DYN_DISCOVERY_BACKEND: etcd
    DYN_REQUEST_PLANE: tcp
    DYN_EVENT_PLANE: zmq
    DYN_TOPOLOGY_ENABLED: 'true'
    DYN_TOPOLOGY_MOUNT_PATH: /root/gdn35/20261023-e2e-1p1d/topology
    DYN_KV_TRANSFER_DOMAIN: host
    DYN_KV_TRANSFER_ENFORCEMENT: required
    UCX_CUDA_IPC_CACHE: n
    DYN_SYSTEM_STARTING_HEALTH_STATUS: notready
    DYN_SYSTEM_USE_ENDPOINT_HEALTH_STATUS: '["generate"]'
    PYTHONPATH: /root/gdn35/20261023-e2e-1p1d/scripts
  command:
  - /opt/sglang/bin/python
  - -m
  - dynamo.sglang
  args:
  - --context-length
  - '262144'
  - --host
  - 0.0.0.0
  - --tensor-parallel-size
  - '1'
  - --mem-fraction-static
  - '0.80'
  - --served-model-name
  - gdn35-e2e
  - --limit-mm-data-per-request
  - '{"video":0}'
  - --mm-process-config
  - '{"image":{"min_pixels":3136,"max_pixels":2097152}}'
  - --enable-multimodal
  - --page-size
  - '16'
  - --max-running-requests
  - '16'
  - --dyn-tool-call-parser
  - qwen3_coder
  - --dyn-reasoning-parser
  - deepseek_r1
  - --enable-metrics
  - --speculative-algorithm
  - DFLASH
  - --speculative-num-draft-tokens
  - '8'
  - --speculative-draft-model-path
  - /root/gdn35/20261023-e2e-1p1d/models/spec_model
  - --disaggregation-transfer-backend
  - nixl
  workers:
  - name: p0
    health_url: http://127.0.0.1:18081/health
    env:
      CUDA_VISIBLE_DEVICES: '6'
      DYN_SYSTEM_PORT: '18081'
      GDN35_PATCH: '1'
    args:
    - --model-path
    - /root/gdn35/20261023-e2e-1p1d/models/prefill_model
    - --disaggregation-mode
    - prefill
    - --nccl-port
    - '19506'
    - --kv-events-config
    - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:55606"}'
  - name: d0
    health_url: http://127.0.0.1:18082/health
    env:
      CUDA_VISIBLE_DEVICES: '7'
      DYN_SYSTEM_PORT: '18082'
    args:
    - --model-path
    - /root/gdn35/20261023-e2e-1p1d/models/decode_model
    - --disaggregation-mode
    - decode
    - --nccl-port
    - '19507'
    - --kv-events-config
    - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:55607"}'
